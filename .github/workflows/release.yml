name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and benchmarks
        run: ./gradlew :core-engine:test :app:testDebugUnitTest --console=plain

      - name: Assemble Release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Sign Release APK
        env:
          KEYSTORE_B64: ${{ secrets.TASK_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.TASK_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.TASK_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.TASK_KEY_PASS }}
        run: |
          mkdir -p dist
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="dist/task-release.apk"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            "$BUILD_TOOLS/apksigner" sign \
              --ks release.jks \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASS" \
              --out "$SIGNED" "$UNSIGNED"
          else
            keytool -genkeypair -v -keystore ephemeral.jks -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias task -storepass taskpass -keypass taskpass \
              -dname "CN=T.A.S.K., O=Totally Accurate Labs, C=BR"
            "$BUILD_TOOLS/apksigner" sign \
              --ks ephemeral.jks \
              --ks-pass pass:taskpass \
              --ks-key-alias task \
              --key-pass pass:taskpass \
              --out "$SIGNED" "$UNSIGNED"
          fi
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-release-apk
          path: dist/task-release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/task-release.apk
